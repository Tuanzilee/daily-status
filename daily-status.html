<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日狀態">
<meta name="theme-color" content="#0f0f0f">
<title>每日狀態記錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2e2e2e;
    --border-active: #555;
    --text: #e8e8e8;
    --text-secondary: #888;
    --text-dim: #555;
    --accent: #e8e8e8;
    --green: #4a8c3f;
    --green-bg: #1a2e18;
    --green-text: #7ec97a;
    --yellow: #8c7a2a;
    --yellow-bg: #2a2515;
    --yellow-text: #d4b84a;
    --orange: #8c4a2a;
    --orange-bg: #2a1a12;
    --orange-text: #d4804a;
    --red: #8c2a2a;
    --red-bg: #2a1212;
    --red-text: #d44a4a;
    --gray: #3a3a3a;
    --gray-bg: #1e1e1e;
    --gray-text: #888;
    --blue: #2a5a8c;
    --blue-bg: #12202a;
    --blue-text: #4a9ad4;
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'Noto Sans TC', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  html { background: var(--bg); }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header-title {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .header-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Section */
  .section { margin-bottom: 24px; }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* Level buttons */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .lv-btn {
    padding: 10px 4px;
    font-size: 11px;
    font-family: var(--font);
    font-weight: 400;
    line-height: 1.4;
    text-align: center;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    -webkit-appearance: none;
  }
  .lv-btn .icon { font-size: 18px; display: block; margin-bottom: 4px; }
  .lv-btn.active-green  { background: var(--green-bg);  color: var(--green-text);  border-color: var(--green);  }
  .lv-btn.active-yellow { background: var(--yellow-bg); color: var(--yellow-text); border-color: var(--yellow); }
  .lv-btn.active-orange { background: var(--orange-bg); color: var(--orange-text); border-color: var(--orange); }
  .lv-btn.active-red    { background: var(--red-bg);    color: var(--red-text);    border-color: var(--red);    }
  .lv-btn.active-gray   { background: var(--gray-bg);   color: var(--gray-text);   border-color: var(--gray);   }

  /* Tags */
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-btn {
    padding: 7px 12px;
    font-size: 13px;
    font-family: var(--font);
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.12s;
    -webkit-appearance: none;
  }
  .tag-btn.active {
    background: var(--blue-bg);
    color: var(--blue-text);
    border-color: var(--blue);
    font-weight: 500;
  }
  .tag-add-btn {
    padding: 7px 12px;
    font-size: 13px;
    font-family: var(--font);
    border-radius: 100px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    -webkit-appearance: none;
  }

  /* Custom tag input */
  .custom-input-row {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .custom-input-row.show { display: flex; }
  .custom-input {
    flex: 1;
    font-size: 13px;
    font-family: var(--font);
    padding: 8px 12px;
    border: 1px solid var(--blue);
    border-radius: 100px;
    background: var(--blue-bg);
    color: var(--text);
    outline: none;
  }
  .custom-confirm {
    padding: 8px 14px;
    font-size: 13px;
    font-family: var(--font);
    border-radius: 100px;
    border: 1px solid var(--blue);
    background: var(--blue-bg);
    color: var(--blue-text);
    cursor: pointer;
    -webkit-appearance: none;
  }
  .custom-cancel {
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--font);
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    -webkit-appearance: none;
  }

  /* Subject rows */
  .subject-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .subject-input {
    font-size: 13px;
    font-family: var(--font);
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    outline: none;
    width: 100%;
    min-width: 0;
    transition: border-color 0.15s;
  }
  .subject-input:focus { border-color: var(--border-active); }
  .subject-select {
    font-size: 12px;
    font-family: var(--font);
    padding: 9px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text-secondary);
    outline: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    text-align: center;
  }
  .subject-del {
    width: 30px;
    height: 30px;
    font-size: 18px;
    line-height: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    -webkit-appearance: none;
  }
  .add-subject-btn {
    font-size: 13px;
    font-family: var(--font);
    color: var(--blue-text);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    display: block;
    margin-top: 2px;
    -webkit-appearance: none;
  }

  /* Push buttons */
  .push-row { display: flex; gap: 8px; }
  .push-btn {
    flex: 1;
    padding: 10px 8px;
    font-size: 13px;
    font-family: var(--font);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    text-align: center;
    transition: all 0.12s;
    -webkit-appearance: none;
  }
  .push-btn.active-green  { background: var(--green-bg);  color: var(--green-text);  border-color: var(--green);  font-weight: 500; }
  .push-btn.active-yellow { background: var(--yellow-bg); color: var(--yellow-text); border-color: var(--yellow); font-weight: 500; }
  .push-btn.active-red    { background: var(--red-bg);    color: var(--red-text);    border-color: var(--red);    font-weight: 500; }

  /* Textarea */
  .note-input {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    font-size: 13px;
    font-family: var(--font);
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    line-height: 1.7;
    outline: none;
    display: block;
    transition: border-color 0.15s;
  }
  .note-input:focus { border-color: var(--border-active); }
  .note-input::placeholder { color: var(--text-dim); }

  /* Divider */
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* Generate button */
  .gen-btn {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    letter-spacing: 0.04em;
    border-radius: var(--radius);
    border: 1px solid var(--border-active);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    -webkit-appearance: none;
  }
  .gen-btn:active { background: var(--surface); }

  /* Result block */
  .result-block {
    display: none;
    margin-top: 20px;
  }
  .result-block.show { display: block; }
  .result-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .result-text {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 2;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }
  .copy-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    border-radius: var(--radius-sm);
    border: 1px solid var(--blue);
    background: var(--blue-bg);
    color: var(--blue-text);
    cursor: pointer;
    transition: opacity 0.15s;
    -webkit-appearance: none;
  }
  .copy-btn:active { opacity: 0.7; }
  .copy-msg {
    text-align: center;
    font-size: 12px;
    color: var(--green-text);
    margin-top: 8px;
    min-height: 18px;
    font-family: var(--mono);
  }

  /* Error */
  .error-msg {
    font-size: 12px;
    color: var(--red-text);
    margin-top: 8px;
    display: none;
    font-family: var(--mono);
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-title">每日狀態記錄</div>
    <div class="header-date" id="header-date"></div>
  </div>

  <!-- 狀態等級 -->
  <div class="section">
    <div class="section-label">狀態等級</div>
    <div class="level-grid" id="lv-row"></div>
  </div>

  <!-- 影響因素 -->
  <div class="section">
    <div class="section-label">影響因素 <span style="font-size:10px;text-transform:none;letter-spacing:0;color:var(--text-dim)">可多選</span></div>
    <div class="tag-row" id="tag-row"></div>
    <div class="custom-input-row" id="custom-input-row">
      <input class="custom-input" id="custom-tag-input" type="text" placeholder="自訂因素..." maxlength="20">
      <button class="custom-confirm" id="confirm-tag-btn">確認</button>
      <button class="custom-cancel" id="cancel-tag-btn">取消</button>
    </div>
  </div>

  <!-- 今天讀了什麼 -->
  <div class="section">
    <div class="section-label">今天讀了什麼</div>
    <div id="subjects-list"></div>
    <button class="add-subject-btn" id="add-subject-btn">＋ 新增科目</button>
  </div>

  <!-- 有沒有硬推 -->
  <div class="section">
    <div class="section-label">有沒有硬推？</div>
    <div class="push-row" id="push-row"></div>
  </div>

  <!-- 備註 -->
  <div class="section">
    <div class="section-label">備註</div>
    <textarea class="note-input" id="note" placeholder="今天讀到某章節卡關，沒有硬撐..."></textarea>
  </div>

  <hr class="divider">

  <div class="error-msg" id="error-msg">請先選擇今天的狀態等級</div>
  <button class="gen-btn" id="genBtn">產生今日紀錄</button>

  <div class="result-block" id="result-block">
    <div class="result-label" style="margin-top:20px">複製貼到 Notion</div>
    <div class="result-text" id="result-text"></div>
    <button class="copy-btn" id="copy-btn">複製</button>
    <div class="copy-msg" id="copy-msg"></div>
  </div>

</div>

<script>
  let selectedLevel = '', selectedLevelClass = '', selectedTags = [], selectedPush = '', selectedPushClass = '', customTags = [];

  const LEVELS = [
    { label: '🟢', sub: '1–2\n正常',       val: '🟢 Lv1-2 正常',       cls: 'active-green'  },
    { label: '🟡', sub: '3–4\n輕微',        val: '🟡 Lv3-4 輕微疲勞',  cls: 'active-yellow' },
    { label: '🟠', sub: '5–6\n明顯',        val: '🟠 Lv5-6 明顯不舒服',cls: 'active-orange' },
    { label: '🔴', sub: '7–8\n快不行',      val: '🔴 Lv7-8 快不行',    cls: 'active-red'    },
    { label: '⚫', sub: '9–10\n躺平',       val: '⚫ Lv9-10 躺平',      cls: 'active-gray'   },
  ];
  const PUSHES = [
    { label: '✅ 滑順', val: '沒有，很滑順', cls: 'active-green'  },
    { label: '⚠️ 有點', val: '有一點',       cls: 'active-yellow' },
    { label: '🚨 硬推', val: '硬推了',       cls: 'active-red'    },
  ];
  const DEFAULT_TAGS = ['睡眠不足','睡眠充足','壓力大','身體不適','飲食不佳','心情好','焦慮','運動恢復中'];
  const MODES = ['深度學習','做題目','輕量複習','錯題整理','AI輔助'];

  // Header date
  const d = new Date();
  document.getElementById('header-date').textContent =
    `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;

  function renderLevels() {
    const row = document.getElementById('lv-row'); row.innerHTML = '';
    LEVELS.forEach(lv => {
      const b = document.createElement('button');
      b.className = 'lv-btn' + (selectedLevel === lv.val ? ' ' + lv.cls : '');
      b.innerHTML = `<span class="icon">${lv.label}</span>${lv.sub.replace('\n','<br>')}`;
      b.onclick = () => { selectedLevel = lv.val; selectedLevelClass = lv.cls; renderLevels(); };
      row.appendChild(b);
    });
  }

  function renderTags() {
    const row = document.getElementById('tag-row'); row.innerHTML = '';
    [...DEFAULT_TAGS, ...customTags].forEach(t => {
      const b = document.createElement('button');
      b.className = 'tag-btn' + (selectedTags.includes(t) ? ' active' : '');
      b.textContent = t;
      b.onclick = () => {
        selectedTags = selectedTags.includes(t) ? selectedTags.filter(x => x !== t) : [...selectedTags, t];
        renderTags();
      };
      row.appendChild(b);
    });
    const ab = document.createElement('button');
    ab.className = 'tag-add-btn'; ab.textContent = '＋ 自訂';
    ab.onclick = () => {
      const r = document.getElementById('custom-input-row');
      r.classList.add('show');
      document.getElementById('custom-tag-input').value = '';
      document.getElementById('custom-tag-input').focus();
    };
    row.appendChild(ab);
  }

  function renderPush() {
    const row = document.getElementById('push-row'); row.innerHTML = '';
    PUSHES.forEach(p => {
      const b = document.createElement('button');
      b.className = 'push-btn' + (selectedPush === p.val ? ' ' + p.cls : '');
      b.textContent = p.label;
      b.onclick = () => { selectedPush = p.val; renderPush(); };
      row.appendChild(b);
    });
  }

  function confirmCustomTag() {
    const val = document.getElementById('custom-tag-input').value.trim();
    if (val && !DEFAULT_TAGS.includes(val) && !customTags.includes(val)) {
      customTags.push(val); selectedTags = [...selectedTags, val];
    }
    document.getElementById('custom-input-row').classList.remove('show');
    renderTags();
  }
  document.getElementById('confirm-tag-btn').onclick = confirmCustomTag;
  document.getElementById('cancel-tag-btn').onclick = () => document.getElementById('custom-input-row').classList.remove('show');
  document.getElementById('custom-tag-input').addEventListener('keydown', e => { if (e.key === 'Enter') confirmCustomTag(); });

  function addSubject() {
    const list = document.getElementById('subjects-list');
    const wrap = document.createElement('div'); wrap.className = 'subject-item';
    const ni = document.createElement('input');
    ni.type = 'text'; ni.className = 'subject-input'; ni.placeholder = '科目 / 章節名稱';
    const sel = document.createElement('select'); sel.className = 'subject-select';
    MODES.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o); });
    const db = document.createElement('button'); db.className = 'subject-del'; db.type = 'button'; db.textContent = '×';
    db.onclick = () => list.removeChild(wrap);
    wrap.appendChild(ni); wrap.appendChild(sel); wrap.appendChild(db);
    list.appendChild(wrap); ni.focus();
  }
  document.getElementById('add-subject-btn').onclick = addSubject;

  function getSubText() {
    const parts = [];
    document.getElementById('subjects-list').querySelectorAll('.subject-item').forEach(row => {
      const ni = row.querySelector('input'), sel = row.querySelector('select');
      if (ni && sel && ni.value.trim()) parts.push(`${ni.value.trim()}（${sel.value}）`);
    });
    return parts.join('、');
  }

  function today() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  document.getElementById('genBtn').onclick = function () {
    const errEl = document.getElementById('error-msg');
    if (!selectedLevel) { errEl.classList.add('show'); return; }
    errEl.classList.remove('show');
    const sub = getSubText();
    const note = document.getElementById('note').value.trim();
    const pushEmoji = selectedPush === '沒有，很滑順' ? '✅' : selectedPush === '有一點' ? '⚠️' : '🚨';
    const lines = [
      `📅 ${today()}　${selectedLevel}`,
      selectedTags.length ? `💊 ${selectedTags.join('・')}` : null,
      sub ? `📚 ${sub}` : null,
      selectedPush ? `${pushEmoji} ${selectedPush}` : null,
      note ? `📝 ${note}` : null,
    ].filter(Boolean).join('\n');
    document.getElementById('result-text').textContent = lines;
    const block = document.getElementById('result-block');
    block.classList.add('show');
    block.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  document.getElementById('copy-btn').onclick = function () {
    const text = document.getElementById('result-text').textContent;
    const msg = document.getElementById('copy-msg');
    navigator.clipboard.writeText(text).then(() => {
      msg.textContent = '已複製 ✓';
      setTimeout(() => msg.textContent = '', 2000);
    }).catch(() => {
      // fallback for older mobile browsers
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); msg.textContent = '已複製 ✓'; }
      catch { msg.textContent = '請手動長按複製'; }
      document.body.removeChild(ta);
      setTimeout(() => msg.textContent = '', 2000);
    });
  };

  renderLevels(); renderTags(); renderPush(); addSubject();
</script>
</body>
</html>
